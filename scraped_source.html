  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background-color: #222;
      background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 40px 40px;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #tv {
      /* position: absolute; */
      position: fixed;
      top: 6.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      /* max-width: 1000px; */
      height: 85%;
      background: white;
      border: 2px solid whitesmoke;
      overflow: hidden;
      border-radius: 25px; 
      box-shadow: 0 5px 40px rgba(255, 255, 255, 0.7); 
    }
    #tv iframe {
      width: 100%;
      height: calc(100% - 30px);
      margin-top: 30px;
      border: none;
    }
    #menu {
      display: none;
      position: fixed;
      bottom: 7.5%;
      width: calc(95% - 15px);
      max-height: 30%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px;
      background: white;
      /* display: flex; */
      justify-content: space-evenly;
      align-items: center;
      border-radius: 10px;
      left: 2%;
      right: 2%;
      box-shadow: 0 5px 40px rgba(255, 0, 0, 0.7); /* Adjust shadow as needed */
      scrollbar-width: thin; /* For Firefox */
      scrollbar-color: #ff6b6b #f1f1f1; /* Thumb and track colors for Firefox */
    }
    /* Custom scroll for WebKit browsers */
    #menu::-webkit-scrollbar {
      width: 12px;
    }

    #menu::-webkit-scrollbar-track {
      background: #f1f1f1; /* Background color of the scrollbar track */
      border-radius: 6px;
    }

    #menu::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, #ff6b6b, #ffde59, #6bff59, #59deff);
      border-radius: 6px;
    }

    #menu::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(45deg, #ff3b3b, #ffc700, #3bff3b, #00c7ff);
    }
    .page {
      min-width: 130px;
      width: max-content;
      height: 40px;
      margin-right: 10px;
      border: 1px solid white;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid red;
      border-radius: 20px;
      justify-content: center;
      font-weight: bolder;
    }
    .page:hover {
      border: 2px solid #007bff;
    }
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 10px 0;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 0.9rem;
    }
    #mobileMenuToggle {
      /* display: none; */
      position: fixed;
      bottom: 5px;
      left: 10px;
      z-index: 999;
      color: rgb(255, 255, 255);
      font-size: 25px;
      cursor: pointer;
      animation: blink-animation 1s infinite; /* Blinking animation */
    }
    #privacyPolocyToggle {
      /* display: none; */
      position: fixed;
      bottom: 2px;
      right: 5px;
      z-index: 999;
      color: rgb(255, 255, 255);
      font-size: 25px;
      cursor: pointer;
    }
    @keyframes blink-animation {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    #visitSiteBtn {
        position: absolute;
        bottom: 0;
        width: 50%;
        right: 25%;
        left: 25%;
        padding: 10px 10px;
        font-size: 1rem;
        background-color: rgba(0, 0, 0, 0.6);
        opacity: 0.9;
        color: white;
        font-weight: bolder;
        border: none;
        cursor: pointer;
        /* border: 3px solid white; */
        /* border-radius: 20px; */
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
        text-shadow: #000 1px 1px 2px;
    }
    #audio {
      display: none;
    }
    #muteButton {
        position: fixed;
        top: 0;
        right: 0;
        font-size: 25px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 99999;
    }
    @media only screen and (max-device-width: 414px) and (orientation: portrait) {
        #muteButton {
            right: -15px; /* Adjust the value as needed for portrait orientation on iPhones */
        }
    }
    /* Styles for image */
    #imageContainer {
      position: fixed; /* Changed to fixed for consistent positioning */
      top: 0px;
      left: 0px;
      display: inline-block;
      z-index: 99999;
    }

    #popupTrigger {
      width: 30px; /* Adjust as per your image size */
      height: auto; /* Adjust as per your image size */
      cursor: pointer;
      border-bottom-right-radius: 10px;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      0% {
        box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.5);
      }
      100% {
        box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.9); /* Adjust glow effect as needed */
      }
    }

    .popup {
      display: none;
      position: absolute;
      top: 4%;
      left: 2%;
      background-color: rgba(255, 255, 255, 0.5);
      border: 1px solid #222;
      padding: 17px;
      border-radius: 10px;
      z-index: 9999999;
    }
    .popup-content {
      display: flex;
      flex-direction: column;
    }
    #sleepBtn, #restartBtn, #shutdownBtn {
      padding: 10px;
      margin: 5px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      font-weight: bolder;
      border-radius: 20px;
      width: 90%;
    }
    #topBar {
      position: fixed;
      top: 0;
      left: 10%;
      width: 80%;
      height: 30px;
      font-weight: bold;
      background-color: green;
      color: white;
      text-align: center;
      line-height: 30px;
      z-index: 9999;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    #topBars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      z-index: 9999;
      font-size: 1rem;
    }

    #topBars div {
      display: flex;
      align-items: center;
    }

    #time:before {
      content: "\23F2"; /* Font Awesome clock icon */
      margin-right: 5px;
    }

    #ip:before {
      content: "\1F310"; /* Font Awesome globe icon */
      margin-right: 5px;
    }

    #battery:before {
      content: "\1f50b"; /* Font Awesome battery icon */
      margin-right: 15px;
    }

    #deviceIndicator {
      position: fixed;
      top: 55%;
      right: 0;
      background-color: rgb(255, 204, 0);
      color: black;
      padding: 10px;
      /* border-radius: 5px; */
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      cursor: pointer;
      transition: width 0.3s;
      z-index: 9999999;
      user-select: none; /* Prevent text selection */
      -webkit-tap-highlight-color: transparent; /* Remove tap highlight on iOS */
      box-shadow: 0 15px 40px rgba(255, 204, 0, 0.6);
      writing-mode: vertical-lr;
    }

    #deviceIndicator.closed {
      width: max-content;
      overflow: hidden;
      z-index: 9999999;
    }

    #deviceIndicator.open {
      width: max-content;
      z-index: 9999999;
    }

    #sleep-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      display: none;
    }

    #sleep-emoji {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50px;
      z-index: 1001;
      display: none;
    }

    #loader {
      border: 4px solid #f3f3f3; /* Light grey */
      border-top: 4px solid red;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 2s linear infinite, lightMove 2s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
    }
    
    @keyframes spin {
      0% { 
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(-90deg);
      }
      50% {
        transform: rotate(-180deg);
      }
      75% {
        transform: rotate(-90deg);
      }
      100% { 
        transform: rotate(0deg);
      }
    }

    @keyframes lightMove {
      0% { 
        box-shadow: 0 0 10px green, 0 0 20px green, 0 0 30px green, 0 0 40px green, 0 0 50px green, 0 0 60px green, 0 0 70px green, 0 0 80px green;
      }
      50% { 
        box-shadow: 0 0 10px green, 0 0 20px green, 0 0 30px green, 0 0 40px green, 0 0 50px green, 0 0 60px green, 0 0 70px green, 0 0 80px green;
      }
      100% { 
        box-shadow: 0 0 10px green, 0 0 20px green, 0 0 30px green, 0 0 40px green, 0 0 50px green, 0 0 60px green, 0 0 70px green, 0 0 80px green;
      }
    }

    /* Sparkle Animation */
    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: white;
      border-radius: 50%;
      animation: sparkle 1s infinite;
      opacity: 0;
    }

    @keyframes sparkle {
      0% {
        opacity: 0;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(2);
      }
      100% {
        opacity: 0;
        transform: scale(1);
      }
    }
    .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999999999;
    }

    .splash-content {
        text-align: center;
    }

    #typingText {
        color: white;
        font-size: 36px;
        font-family: 'Arial Black', sans-serif;
        font-weight: bold;
        animation: blink-caret 0.75s step-end infinite;
    }

    @keyframes blink-caret {
        from, to { border-color: transparent; }
        50% { border-color: white; }
    }

    #ppMenu {
      position: fixed;
      bottom: 40px;
      right: 10px;
      padding: 10px 15px;
      background-color: #333;
      color: white;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      display: none; /* Initially hidden */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      padding: 1%;
      font-size: 1rem;
      min-width: 150px;
    }

    #ppMenu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    #ppMenu ul li {
      margin: 15px 0;
    }

    #ppMenu ul li a {
      color: white;
      text-decoration: none;
    }

    #ppMenu ul li a:hover {
      text-decoration: underline;
    }

    /* Fixed Lighting Button on the left */
    #lightingBtn {
      position: fixed;
      /* left: 10px; */
      top: 79%;
      transform: translateY(-50%);
      z-index: 1000;
      background: linear-gradient(45deg, #000, #333);
      border: none;
      padding: 10px 10px;
      border-top-right-radius: 50%;
      border-bottom-right-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      font-size: 1.2rem;
      color: #fff;
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover state for a subtle scale and shadow enhancement */
    #lightingBtn:hover {
      background: linear-gradient(45deg, #333, #555);
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6);
    }

    /* Active state for tactile feedback */
    #lightingBtn:active {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    /* Lighting Preferences Popup Enhanced UX */
    #lightingPopup {
      position: fixed;
      left: 50px;
      top: 75%;
      transform: translateY(-50%);
      background-color: #f9f9f9;  /* light background */
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1001;
      width: 280px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    /* Display popup when active */
    #lightingPopup.active {
      opacity: 1;
      visibility: visible;
    }

    /* Popup header */
    #lightingPopup h3 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #333;
      text-align: center;
      margin-bottom: 15px;
    }

    /* Label styling for options */
    #lightingPopup label {
      display: block;
      /* margin-bottom: 5px; */
      font-size: 0.95rem;
      color: #555;
      cursor: pointer;
    }

    /* Inline elements for color picker and select */
    #lightingPopup input[type="color"],
    #lightingPopup select {
      margin-left: 8px;
      vertical-align: middle;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Apply Button Styling */
    #lightingPopup button {
      display: block;
      width: 100%;
      margin-top: 15px;
      background-color: #4CAF50;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    /* Hover state for button */
    #lightingPopup button:hover {
      background-color: #45a049;
    }

    /* Optional: Add a close button at the top right */
    #lightingPopup .close-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #999;
    }
    #lightingPopup .close-btn:hover {
      color: #666;
    }

    /* Container for custom radio buttons */
    .custom-radio {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    /* Hide the default radio appearance */
    .custom-radio input[type="radio"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: border-color 0.3s, background-color 0.3s;
    }

    /* Custom checked state */
    .custom-radio input[type="radio"]:checked {
      border-color: #4CAF50;
      background-color: #4CAF50;
    }

    /* Create the inner circle for the checked state */
    .custom-radio input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #fff;
    }

    /* Label styling */
    .custom-radio label {
      margin-left: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      color: #555;
    }

    /* Additional styling for inline elements within labels */
    .custom-radio label input[type="color"],
    .custom-radio label select {
      margin-left: 8px;
      vertical-align: middle;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Preset Animations */

    /* Rainbow Glow Animation */
    @keyframes rainbowGlow {
      0%   { box-shadow: 0 0 60px 10px rgba(255, 0, 0, 0.8); }
      20%  { box-shadow: 0 0 60px 10px rgba(0, 255, 0, 0.8); }
      40%  { box-shadow: 0 0 60px 10px rgba(0, 0, 255, 0.8); }
      60%  { box-shadow: 0 0 60px 10px rgba(255, 255, 0, 0.8); }
      80%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
      100% { box-shadow: 0 0 60px 10px rgba(255, 0, 255, 0.8); }
    }

    /* Pulse Glow Animation */
    @keyframes pulseGlow {
      0%   { box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.5); }
      50%  { box-shadow: 0 0 60px 20px rgba(255, 255, 255, 0.9); }
      100% { box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.5); }
    }

    /* Wave Glow Animation */
    @keyframes waveGlow {
      0%   { box-shadow: 0 0 60px 10px rgba(255, 100, 0, 0.8); }
      25%  { box-shadow: 0 0 70px 15px rgba(255, 150, 0, 0.8); }
      50%  { box-shadow: 0 0 60px 10px rgba(255, 100, 0, 0.8); }
      75%  { box-shadow: 0 0 70px 15px rgba(255, 150, 0, 0.8); }
      100% { box-shadow: 0 0 60px 10px rgba(255, 100, 0, 0.8); }
    }

    /* Flicker Glow Animation */
    @keyframes flickerGlow {
      0%   { box-shadow: 0 0 60px 10px rgba(255, 255, 255, 0.8); }
      20%  { box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.4); }
      40%  { box-shadow: 0 0 60px 10px rgba(255, 255, 255, 0.8); }
      60%  { box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.4); }
      80%  { box-shadow: 0 0 60px 10px rgba(255, 255, 255, 0.8); }
      100% { box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.4); }
    }

    /* Strobe Glow Animation */
    @keyframes strobeGlow {
      0%   { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
      10%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.2); }
      20%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
      30%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.2); }
      40%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
      50%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.2); }
      60%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
      70%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.2); }
      80%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
      90%  { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.2); }
      100% { box-shadow: 0 0 60px 10px rgba(0, 255, 255, 0.8); }
    }

    /* =========================================== */
    /* ===== MOBILE & SMALL SCREEN STYLES ======== */
    /* =========================================== */
    @media screen and (max-width: 768px) {
      body, html {
        overflow: auto; /* Allow scrolling if needed */
      }
      
      /* Hide distracting desktop-only elements */
      #topBar, #deviceIndicator, #visitSiteBtn, #lightingBtn {
        display: none;
      }

      /* Make the TV frame a full-screen container */
      #tv {
        top: 0;
        left: 0;
        width: 100vw;
        height: 98%;
        border-radius: 0;
        border: none;
        box-shadow: none;
        transform: none; /* Reset desktop positioning */
      }

      /* Adjust the top info bar for mobile */
      #topBars {

  <script>
    const audio = document.getElementById('audio');

      var popup = document.getElementById("popup");

    function restartSite() {
      localStorage.clear();
      window.top.location.reload();

    async function shutDownSite() {
      localStorage.clear();
      await clearSiteData(); // Clear site data
      // Redirect to bye.html
      window.top.location.href = "https://chiragganguli.com/bye";
    }

    async function clearSiteData() {
      // Clear Cache (Service Worker)
      if ('caches' in window) {
          caches.keys().then(function (cacheNames) {
              cacheNames.forEach(function (cacheName) {
                  caches.delete(cacheName);
              });
          });
      }

      // Clear Cookies
      var cookies = document.cookie.split(";");
      for (var i = 0; i < cookies.length; i++) {
          var cookie = cookies[i];
          var eqPos = cookie.indexOf("=");
          var name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
          document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT";
      }

      // Inform user
      console.log("Site data cleared. Please close this tab manually.");
    }

    function loadPage(pageURL) {

    function updateIP() {
      const ipElement = document.getElementById('ip');
      // Fetch user's IP address using an API or other method
      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {

        });

    function updateBattery() {
      const batteryElement = document.getElementById('battery');
      navigator.getBattery().then(function(battery) {
        const batteryPercent = Math.round(battery.level * 100);
        if(getDeviceType() === 'Computer' || getDeviceType() === 'TV') {
          batteryElement.style.display = 'inline'; // Show battery element for computers and TVs
          batteryElement.textContent = batteryPercent + '%';
          // add space after percentage
          batteryElement.style.marginRight = '20px';
        } else {
          batteryElement.style.opacity = '0'; // Hide battery element for mobile devices
        }
      });
    }

    // Update dynamic content every second
    setInterval(updateTime, 1000);
    updateTime(); // Initial update
    updateIP(); // Initial update
    updateBattery(); // Initial update
    setInterval(updateBattery, 30000); // Update battery every 30secs

    // Function to play a random song
    function playRandomSong() {
        const randomIndex = Math.floor(Math.random() * songs.length);
        audio.src = songs[randomIndex];
        audio.play();
    }

    // Function to mute/unmute the audio
    function toggleMute() {
      if(audioMuted) {
        playRandomSong();
        audioMuted = false;
        muteButton.innerHTML = '&#x1F50A;';
      } else {
        audio.pause();
        audioMuted = true;
        muteButton.innerHTML = '&#x1F507;';
      }
    }

    function toggleIndicator() {
      const deviceIndicator = document.getElementById('deviceIndicator');
      deviceIndicator.classList.toggle('open');
      deviceIndicator.classList.toggle('closed');

      if (deviceIndicator.classList.contains('open')) {
        // Code to fetch and display device information
        const deviceInfo = getDeviceInfo();
        deviceIndicator.textContent = deviceInfo;
      } else {
        deviceIndicator.textContent = getRandomPlanet();
      }
    };

    function getDeviceInfo() {
      // Code to determine the device type and display appropriate information
      const deviceType = getDeviceType();
      const deviceCompany = getDeviceCompany();
      // You can customize this function to return specific device information based on device type
      return `✅ U/A: ${deviceType} ${deviceCompany}`;
    }

    function getDeviceType() {

      if(localStorage.getItem("getDeviceType") !== null) {
        return localStorage.getItem("getDeviceType");
      } else {
        // Code to determine the device type (e.g., mobile, PC, TV)
        const isMobile = /Mobi|Android/i.test(navigator.userAgent);
        const isTV = /SmartTV|SmartTV/i.test(navigator.userAgent);
        
        if (isMobile) {
          localStorage.setItem("getDeviceType", 'Mobile');
          return 'Mobile';
        } else if (isTV) {
          localStorage.setItem("getDeviceType", 'TV');
          return 'TV';
        } else {
          localStorage.setItem("getDeviceType", 'Computer');
          return 'Computer';
        }
      }
    }

    function getDeviceCompany() {

      if(localStorage.getItem("getDeviceCompany") !== null) {
        return localStorage.getItem("getDeviceCompany");
      } else {
        // Code to determine the device company (e.g., Apple, Samsung, Microsoft)
        const userAgent = navigator.userAgent;
        if (/iPhone/.test(userAgent)) {
          localStorage.setItem("getDeviceCompany", 'iPhone');
          return 'iPhone';
        } else if (/iPad/.test(userAgent)) {
          localStorage.setItem("getDeviceCompany", 'iPad');
          return 'iPad';
        } else if (/iPod/.test(userAgent)) {
          localStorage.setItem("getDeviceCompany", 'iPod');
          return 'iPod';
        } else if (/Android/.test(userAgent)) {
          localStorage.setItem("getDeviceCompany", 'Android');
          return 'Android';
        } else if (/Macintosh/.test(userAgent)) {
          localStorage.setItem("getDeviceCompany", 'Mac');
          return 'Mac';
        } else if (/Windows/.test(userAgent)) {
          localStorage.setItem("getDeviceCompany", 'Windows');
          return 'Windows';
        } else {
          return '';
        }
      }
    }

    function getRandomPlanet() {
      const planetNames = [
        "Aurora", "Borealis", "Celestia", "Dawn", "Eclipse",
        "Galactia", "Haven", "Infinity", "Nova", "Orbit",
        "Polaris", "Quasar", "Radiant", "Solaris", "Twilight"
      ];

    function applyLighting() {
      const option = document.querySelector('input[name="lightingOption"]:checked').value;
      const tv = document.getElementById("tv");

      // Remove any preset animation style first
      tv.style.animation = "";

      if (option === "default") {
        // Reset to default white glow
        tv.style.boxShadow = "0 5px 40px rgba(255, 255, 255, 0.7)";
        tv.style.border = "2px solid rgba(255, 255, 255, 0.7)";
      } else if (option === "custom") {
        // Get the custom color value from the color picker
        const color = document.getElementById("colorPicker").value;
        // Use a helper to convert hex to rgba and update the shadow
        tv.style.boxShadow = `0 0 60px 10px ${hexToRgba(color, 0.8)}`;
        tv.style.border = `2px solid ${hexToRgba(color, 0.8)}`;
      } else if (option === "preset") {
        // Choose preset animation based on selection
        const preset = document.getElementById("presetSelect").value;
        switch(preset) {
          case "rainbow":
            tv.style.animation = "rainbowGlow 8s infinite linear";
            tv.style.border = "2px solid transparent";
            break;
          case "pulse":
            tv.style.animation = "pulseGlow 2s infinite alternate";
            tv.style.border = "2px solid transparent";
            break;
          case "wave":
            tv.style.animation = "waveGlow 4s infinite linear";
            tv.style.border = "2px solid transparent";
            break;
          case "flicker":
            tv.style.animation = "flickerGlow 3s infinite linear";
            tv.style.border = "2px solid transparent";
            break;
          case "strobe":
            tv.style.animation = "strobeGlow 1.5s infinite linear";
            tv.style.border = "2px solid transparent";
            break;
        }
      }

      // Hide the popup after applying the changes
      document.getElementById("lightingPopup").classList.remove("active");
    }
    // Helper function to convert hex color to rgba format
    function hexToRgba(hex, alpha) {
      hex = hex.replace("#", "");
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
