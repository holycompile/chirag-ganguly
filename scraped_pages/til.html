  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIL | Chirag Ganguli</title>
  <meta name="description" content="Today I Learned - a daily dose of bite-sized tech knowledge and insights. Stay updated with the latest tech learnings, tips, and trends." />
  <meta name="keywords" content="TIL, Tech, Daily Tech, Learning, Markdown Blog, Tech Insights" />
  <meta name="author" content="Chirag Ganguli" />
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Today I Learned – Byte-Sized Daily Tech Insights" />
  <meta property="og:description" content="A daily source for short, engaging tech insights and learnings, rendered from Markdown." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://til.chiragganguli.com" />

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Font for classic look -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="https://chiragganguli.com/favicon.ico"/>

  <!-- Additional Custom Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Hammer.js for swipe support -->
  <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
</head>
<body class="dark-mode">
  <!-- Header -->
  <header class="gradient-bg shadow-lg p-4 text-center sticky top-0 z-10">
    <h1 class="text-3xl font-bold text-white"><a href="https://chiragganguli.com/home" style="text-decoration: underline;">Chirag</a> 💬 “Today I Learned</h1>
  </header>

  <div id="loader" class="loader">
    <div class="loader-text">
    Brewing
    </div>
  </div>

  <!-- Filter Button & Panel (Floating at Top Left) -->
  <div id="filter-panel" class="filter-panel">
    <!-- When collapsed, only "Filter" text is visible -->
    <div id="filter-summary">
      <span class="text-white font-bold">Filter</span>
    </div>
    <!-- Hidden panel content -->
    <div id="filter-content" class="hidden">
      <!-- <h2 class="text-white">Apply Filter</h2> -->
      <!-- Tag Filter -->
      <label class="text-gray-400 text-sm" for="tag-filter">Tag:</label>
      <select id="tag-filter">
        <option value="">All</option>
      </select>
      <!-- Date Filter -->
      <label class="text-gray-400 text-sm mt-2" for="date-filter">Date:</label>
      <select id="date-filter">
        <option value="">All</option>
      </select>
      <button id="filter-apply">Apply</button>
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button id="prev-arrow" class="nav-arrow">&#8592;</button>
  <button id="next-arrow" class="nav-arrow">&#8594;</button>

  <!-- Main Content Area -->
  <main class="flex flex-col min-h-screen justify-center items-center px-4 py-8">
    <div id="post-container" class="mb-8">
      <div id="post-date" class="text-sm text-gray-400 mb-2 text-center"></div>
      <div id="post-content" class="prose max-w-none fade"></div>
      <div class="text-center mt-4">
        <a id="toggle-detail" href="#" class="text-indigo-100 underline decoration-dotted hover:text-indigo-200 transition">
          Read More
        </a>
      </div>
      <div id="post-tags" class="mt-6 flex flex-wrap justify-center gap-2"></div>
    </div>
    <!-- Latest post navigation -->
    <div id="latest-link-container" class="self-stretch flex justify-end px-4 py-2">
      <button id="go-to-latest" class="text-indigo-400 underline hover:text-indigo-200 transition-all">
        Latest ✈︎
      </button>
    </div>
  </main>

  <!-- Floating Share Button -->
  <button id="share-btn" class="share-btn" title="Share this TIL">🔗</button>

  <!-- Footer -->
  <footer class="gradient-bg shadow p-2 text-center">
    <p class="text-sm text-gray-300">Made with curiosity © Chirag Ganguli</p>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
